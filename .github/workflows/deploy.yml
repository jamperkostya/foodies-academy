name: Deploy Astro to Hestia

# The static site (dev.foodies.academy) built from the Laravel API. Server setup: deploy/hestia/README.md.

on:
  push:
    branches: [main]
    paths: ['astro-app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # Sent by Laravel (php artisan site:rebuild) after WordPress content changes, and every night.
  repository_dispatch:
    types: [content-changed]

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The production Laravel API the pages are built from (repository variables).
          API_URL: ${{ vars.API_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync dist to server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
