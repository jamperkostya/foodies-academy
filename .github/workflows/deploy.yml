name: Deploy Astro to Hestia

# The static site built from the Laravel API: dev.foodies.academy on push to main, foodies.academy
# (environment "production") by hand. Server setup: deploy/hestia/README.md, PRODUCTION.md.

on:
  push:
    branches: [main]
    paths: ['astro-app/**', 'wp-content/mu-plugins/foodies-strings.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy (production only from main)
        type: choice
        options: [dev, production]
        default: dev
      langs:
        description: Languages to build (the others stay as they are on the server)
        type: choice
        options: [all, ru, en]
        default: all
  # Sent by Laravel (php artisan site:rebuild) after WordPress content changes, and every night;
  # the production Laravel sends its own type (GITHUB_DEPLOY_EVENT). client_payload.langs: "en"
  # when only English content changed, "ru", or empty for both.
  repository_dispatch:
    types: [content-changed, content-changed-production]

concurrency: deploy-site-${{ inputs.environment || (github.event.action == 'content-changed-production' && 'production') || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets and variables of the environment override the repository's (those are dev's).
    environment: ${{ inputs.environment || (github.event.action == 'content-changed-production' && 'production') || 'dev' }}
    defaults:
      run:
        working-directory: astro-app
    env:
      # "en", "ru" or "" (both): see builds() in astro-app/src/i18n/lang.ts. Not for the tests,
      # which build every language (npm test runs with it unset).
      LANGS: ${{ github.event.client_payload.langs || (inputs.langs != 'all' && inputs.langs) || '' }}
    steps:
      # Production only gets code that is in main. Without the "production" environment GitHub would
      # silently use the repository secrets, which point at dev.
      - name: Check production target
        if: inputs.environment == 'production' || github.event.action == 'content-changed-production'
        working-directory: .  # runs before checkout, when the job's folder doesn't exist yet
        env:
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Production is deployed from main only"; exit 1; }
          case "$TARGET" in
            */web/foodies.academy/*) ;;
            *) echo "DEPLOY_PATH of the production environment is not set (got: $TARGET)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The Laravel API the pages are built from (variables of the environment).
          API_URL: ${{ vars.API_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          BUILD_LANGS: ${{ env.LANGS }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Only what was built: one language's build leaves the other language's pages on the server.
      - name: Rsync dist to server
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}
          SSH: ssh -p ${{ secrets.SSH_PORT }}
        run: |
          case "$LANGS" in
            en)
              rsync -az --delete -e "$SSH" dist/en/ "$TARGET/en/"
              # Redirects (old English slugs too) and the English sitemaps.
              rsync -az -e "$SSH" dist/.htaccess dist/sitemap.xml dist/sitemap-en-*.xml "$TARGET/"
              ;;
            ru)
              # Excluded paths are also kept on the server by --delete.
              rsync -az --delete --exclude '/en/' --exclude '/sitemap-en-*.xml' -e "$SSH" dist/ "$TARGET/"
              ;;
            *)
              rsync -az --delete -e "$SSH" dist/ "$TARGET/"
              ;;
          esac
