name: Deploy Astro to Hestia

# The static site built from the Laravel API: dev.foodies.academy on push to main, foodies.academy
# (environment "production") by hand. Server setup: deploy/hestia/README.md, PRODUCTION.md.

on:
  push:
    branches: [main]
    paths: ['astro-app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy (production only from main)
        type: choice
        options: [dev, production]
        default: dev
  # Sent by Laravel (php artisan site:rebuild) after WordPress content changes, and every night;
  # the production Laravel sends its own type (GITHUB_DEPLOY_EVENT).
  repository_dispatch:
    types: [content-changed, content-changed-production]

concurrency: deploy-site-${{ inputs.environment || (github.event.action == 'content-changed-production' && 'production') || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets and variables of the environment override the repository's (those are dev's).
    environment: ${{ inputs.environment || (github.event.action == 'content-changed-production' && 'production') || 'dev' }}
    defaults:
      run:
        working-directory: astro-app
    steps:
      # Production only gets code that is in main. Without the "production" environment GitHub would
      # silently use the repository secrets, which point at dev.
      - name: Check production target
        if: inputs.environment == 'production' || github.event.action == 'content-changed-production'
        working-directory: .  # runs before checkout, when the job's folder doesn't exist yet
        env:
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Production is deployed from main only"; exit 1; }
          case "$TARGET" in
            */web/foodies.academy/*) ;;
            *) echo "DEPLOY_PATH of the production environment is not set (got: $TARGET)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The Laravel API the pages are built from (variables of the environment).
          API_URL: ${{ vars.API_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync dist to server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
